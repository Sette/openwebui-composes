services:
  open-webui:
    container_name: 'open-webui'
    image: 'ghcr.io/open-webui/open-webui:main'
    volumes:
      - '${HOME}/app/backend/data:/app/backend/data:rw'
    ports:
      - '7070:8080'
    env_file:
      - .env 
    environment:
      - DATABASE_URL=${DATABASE_URL_OPENWEBUI}
    depends_on:
      - db 
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'always'
    
  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:v1.82.3-stable.patch.2
    volumes:
      - ./config.yaml:/app/config.yaml 
    command:
      - --config=/app/config.yaml
    ports:
      - "7000:4000" # Map the container port to the host, change the host port if necessary
      - "4040:4040"
    env_file:
      - .env # Load local .env file
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - db 
    healthcheck:  # Defines the health check configuration for the container
      test: [ "CMD", "curl", "-f", "http://localhost:4040/health/liveliness || exit 1" ]  # Command to execute for health check
      interval: 30s  # Perform health check every 30 seconds
      timeout: 10s   # Health check command times out after 10 seconds
      retries: 3     # Retry up to 3 times if health check fails
      start_period: 40s  # Wait 40 seconds after container start before beginning health checks
    restart: 'always'

  db:
    image: postgres:16
    container_name: litellm_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - '${HOME}/app/backend/postgres:/var/lib/postgresql/data'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    restart: 'always'

    
